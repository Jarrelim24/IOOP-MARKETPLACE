<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Loop Market — the live NFT marketplace on Loop Network. Every item is read directly from the LoopMarketNFT and LoopMarketplace contracts." />
    <link rel="icon" href="data:," />
    <title>Loop Market — NFT Marketplace on Loop Network</title>
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var savedTheme = localStorage.getItem("loop-market-theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (e) { /* private mode: keep the dark default */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #2081e2;
        --accent-strong: #1868b7;
        --green: #2fbf71;
        --red: #e5484d;
        --amber: #e8930c;
        --radius: 16px;
        --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      [data-theme="dark"] {
        --bg: #0b0d12;
        --bg-soft: #10121a;
        --surface: #151824;
        --surface-2: #1c2030;
        --surface-3: #242839;
        --border: #262b3d;
        --border-soft: #1d2130;
        --text: #f2f4f8;
        --dim: #9aa3b5;
        --dim-2: #6b7390;
        --header-bg: rgba(11, 13, 18, 0.88);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        --img-bg: #1a1e2c;
      }
      [data-theme="light"] {
        --bg: #f6f7f9;
        --bg-soft: #eef0f4;
        --surface: #ffffff;
        --surface-2: #f2f3f7;
        --surface-3: #e7eaf0;
        --border: #dde1ea;
        --border-soft: #e7eaf0;
        --text: #131722;
        --dim: #5c6577;
        --dim-2: #8a93a5;
        --header-bg: rgba(255, 255, 255, 0.9);
        --shadow: 0 12px 28px rgba(19, 23, 34, 0.12);
        --img-bg: #eceef3;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding-bottom: calc(104px + env(safe-area-inset-bottom));
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      .mono { font-family: var(--mono); font-size: 0.92em; }
      .tnum { font-variant-numeric: tabular-nums; }
      .dim { color: var(--dim); }
      .small { font-size: 13px; }
      .wrap { max-width: 1220px; margin: 0 auto; padding: 0 20px; }

      /* ---------- header ---------- */
      header.topbar {
        position: sticky; top: 0; z-index: 60;
        background: var(--header-bg);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-soft);
      }
      .topbar-in { display: flex; align-items: center; gap: 10px; height: 64px; }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; color: var(--text); }
      .brand:hover { text-decoration: none; }
      .brand-mark {
        width: 40px; height: 40px; border-radius: 12px; flex: none;
        background: var(--accent); display: grid; place-items: center;
      }
      .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
      .brand-sub { font-size: 12px; color: var(--dim); line-height: 1.1; white-space: nowrap; }
      .topbar-spacer { flex: 1; }
      .icon-btn {
        width: 36px; height: 36px; min-width: 36px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text); display: inline-grid; place-items: center; padding: 0;
        transition: border-color .15s, background .15s;
      }
      .icon-btn:hover { border-color: var(--dim-2); background: var(--surface-2); }
      .icon-btn svg { width: 18px; height: 18px; }
      .wallet-btn {
        height: 36px; border-radius: 999px; border: 1px solid var(--border);
        background: var(--surface); color: var(--text);
        display: inline-flex; align-items: center; gap: 8px; padding: 0 13px 0 11px;
        font-weight: 700; font-size: 13px;
      }
      .wallet-btn:hover { border-color: var(--dim-2); }
      .wallet-btn svg { width: 17px; height: 17px; }
      .wallet-btn.icon-only { width: 36px; padding: 0; justify-content: center; border-radius: 50%; }
      .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }

      /* ---------- search panel ---------- */
      .search-panel {
        position: fixed; inset: 0; z-index: 80; display: none;
      }
      .search-panel.open { display: block; }
      .search-backdrop { position: absolute; inset: 0; background: rgba(4, 6, 10, 0.55); }
      .search-box {
        position: relative; max-width: 640px; margin: 76px auto 0; width: calc(100% - 32px);
        background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
        box-shadow: var(--shadow); overflow: hidden;
      }
      .search-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
      .search-head svg { width: 19px; height: 19px; color: var(--dim); flex: none; }
      .search-head input {
        flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
        font-size: 16px; font-weight: 600; min-height: 36px;
      }
      .search-head input::placeholder { color: var(--dim-2); }
      .search-results { max-height: min(58vh, 480px); overflow-y: auto; padding: 8px; }
      .search-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim-2); padding: 10px 10px 6px; }
      .search-item {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        background: transparent; border: 0; border-radius: 12px; padding: 8px 10px; color: var(--text); min-height: 52px;
      }
      .search-item:hover { background: var(--surface-2); }
      .search-item img, .search-item .thumb-ph { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; background: var(--img-bg); }
      .search-item .si-name { font-weight: 700; font-size: 14px; }
      .search-item .si-sub { font-size: 12px; color: var(--dim); }
      .search-empty { padding: 22px 14px; color: var(--dim); font-size: 14px; text-align: center; }

      /* ---------- drawer ---------- */
      .drawer-root { position: fixed; inset: 0; z-index: 90; display: none; }
      .drawer-root.open { display: block; }
      .drawer-backdrop { position: absolute; inset: 0; background: rgba(4, 6, 10, 0.55); }
      .drawer {
        position: absolute; top: 0; left: 0; bottom: 0; width: min(320px, 88vw);
        background: var(--surface); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; overflow-y: auto;
        animation: drawer-in .22s ease;
      }
      @keyframes drawer-in { from { transform: translateX(-24px); opacity: .4; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } html { scroll-behavior: auto; } }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
      .drawer-profile { margin: 2px 16px 14px; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; }
      .drawer-nav { padding: 4px 10px 16px; display: flex; flex-direction: column; gap: 2px; }
      .drawer-link {
        display: flex; align-items: center; gap: 13px; padding: 9px 8px; border-radius: 12px;
        color: var(--text); font-weight: 700; font-size: 15px; background: transparent; border: 0; text-align: left; width: 100%; min-height: 48px;
      }
      .drawer-link:hover { background: var(--surface-2); text-decoration: none; }
      .drawer-link .dic {
        width: 38px; height: 38px; border-radius: 50%; flex: none;
        background: var(--surface-3); display: grid; place-items: center; color: var(--text);
      }
      .drawer-link .dic svg { width: 18px; height: 18px; }
      .drawer-sep { height: 1px; background: var(--border-soft); margin: 10px 8px; }

      /* ---------- layout / generic ---------- */
      main { min-height: 62vh; }
      .page { padding: 26px 0 56px; }
      h1.hero-title { font-size: clamp(30px, 5.4vw, 46px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 800; margin: 6px 0 12px; max-width: 720px; }
      .hero-sub { color: var(--dim); font-size: 16px; line-height: 1.6; max-width: 640px; margin: 0 0 8px; }
      h2.section-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 34px 0 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h2.section-title .hint { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: 0; }
      h1.page-title { font-size: clamp(26px, 4.4vw, 36px); font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 8px; }
      .page-sub { color: var(--dim); max-width: 680px; margin: 0 0 10px; }
      .card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent;
        font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--text);
        transition: background .15s, border-color .15s, opacity .15s;
      }
      .btn:hover { text-decoration: none; }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-strong); }
      .btn-ghost { background: transparent; border-color: var(--border); }
      .btn-ghost:hover { border-color: var(--dim-2); }
      .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
      .btn[disabled] { opacity: .45; cursor: not-allowed; }
      .btn-sm { min-height: 38px; padding: 0 16px; font-size: 14px; }
      .btn-block { width: 100%; }
      .verified { display: inline-grid; place-items: center; color: var(--accent); vertical-align: -3px; margin-left: 5px; }
      .verified svg { width: 17px; height: 17px; }
      .addr { font-family: var(--mono); font-size: .92em; }
      .addr-btn { background: none; border: 0; color: var(--accent); font-family: var(--mono); font-size: .92em; padding: 4px 2px; min-height: 32px; font-weight: 600; }
      .addr-btn:hover { text-decoration: underline; }
      .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
        border-radius: 999px; padding: 0 16px; min-height: 38px; font-weight: 700; font-size: 14px;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
      .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 999px; padding: 3px; gap: 2px; }
      .seg button { border: 0; background: transparent; color: var(--dim); font-weight: 800; font-size: 13px; border-radius: 999px; padding: 0 16px; min-height: 34px; }
      .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,.25); }
      [data-theme="light"] .seg button.active { box-shadow: 0 1px 5px rgba(19,23,34,.14); }
      .empty-note { padding: 34px 20px; text-align: center; color: var(--dim); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); font-size: 14px; }
      .skeleton { border-radius: var(--radius); background: linear-gradient(100deg, var(--surface) 40%, var(--surface-2) 50%, var(--surface) 60%); background-size: 200% 100%; animation: sk 1.3s infinite; min-height: 180px; }
      @keyframes sk { from { background-position: 120% 0; } to { background-position: -80% 0; } }
      @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
      .status-line { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; margin: 10px 0 0; }
      .status-line .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
      .status-line.off .pulse { background: var(--red); }

      /* ---------- hero carousel ---------- */
      .carousel { position: relative; margin-top: 18px; }
      .car-viewport { overflow: hidden; border-radius: 22px; }
      .car-track { display: flex; transition: transform .55s cubic-bezier(.22,.8,.24,1); will-change: transform; }
      @media (prefers-reduced-motion: reduce) { .car-track { transition: none; } }
      .car-slide { flex: 0 0 100%; min-width: 0; }
      .hero-card { position: relative; border-radius: 22px; overflow: hidden; background: var(--surface); border: 1px solid var(--border-soft); cursor: pointer; text-align: left; width: 100%; padding: 0; display: block; color: var(--text); }
      .hero-media { position: relative; aspect-ratio: 16 / 8.2; background: var(--img-bg); overflow: hidden; }
      .hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .hero-media .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,14,0) 42%, rgba(5,8,14,.72) 100%); }
      .hero-chip { position: absolute; top: 16px; left: 16px; background: rgba(8,10,16,.72); color: #fff; font-weight: 700; font-size: 13px; padding: 7px 13px; border-radius: 999px; backdrop-filter: blur(6px); }
      .hero-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 22px; color: #fff; }
      .hero-coll { font-size: clamp(22px, 4vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
      .hero-by { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); margin-top: 5px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
      .hero-stats { display: flex; gap: 34px; margin-top: 14px; flex-wrap: wrap; }
      .hero-stats .hs-label { font-size: 11px; font-weight: 800; letter-spacing: .09em; color: rgba(255,255,255,.72); }
      .hero-stats .hs-value { font-size: 19px; font-weight: 800; margin-top: 2px; }
      .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
      .car-arrows { display: flex; gap: 8px; }
      .car-arrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; }
      .car-arrow:hover { border-color: var(--dim-2); }
      .car-arrow svg { width: 17px; height: 17px; }
      .car-dots { display: flex; gap: 5px; align-items: center; }
      .car-dot { width: 6px; height: 6px; border-radius: 999px; border: 0; padding: 0; background: var(--dim-2); opacity: .55; min-height: 6px; transition: width .25s, background .25s, opacity .25s; }
      .car-dot.active { width: 17px; background: var(--accent); opacity: 1; }
      .car-dot-wrap { padding: 10px 2px; background: none; border: 0; display: grid; place-items: center; min-height: 36px; }
      @media (max-width: 640px) { .hero-media { aspect-ratio: 4 / 3.4; } .hero-stats { gap: 22px; } }

      /* ---------- rank cards (buyers/sellers) ---------- */
      .rank-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(228px, 252px); gap: 14px; overflow-x: auto; padding: 6px 2px 14px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
      .rank-card { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; text-align: left; padding: 0; color: var(--text); width: 100%; }
      .rank-card:hover { border-color: var(--border); }
      .rank-media { aspect-ratio: 16 / 9; background: var(--img-bg); position: relative; overflow: hidden; }
      .rank-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .rank-badge { position: absolute; top: 10px; left: 10px; background: rgba(8,10,16,.75); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
      .rank-body { padding: 13px 15px 15px; }
      .rank-who { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 14px; min-width: 0; }
      .rank-meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: 13px; }
      .rank-meta .rm-label { color: var(--dim-2); font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
      .rank-meta .rm-value { font-weight: 800; }

      /* ---------- NFT grid ---------- */
      .nft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
      @media (max-width: 560px) { .nft-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
      .nft-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; text-align: left; padding: 0; color: var(--text); width: 100%; display: block; }
      .nft-card:hover { border-color: var(--border); }
      .nft-media { aspect-ratio: 1 / 1; background: var(--img-bg); position: relative; overflow: hidden; }
      .nft-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .nft-body { padding: 12px 14px 14px; }
      .nft-name { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nft-sub { font-size: 12px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nft-price { margin-top: 9px; display: flex; justify-content: space-between; align-items: baseline; }
      .nft-price .p-label { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--dim-2); }
      .nft-price .p-value { font-weight: 800; font-size: 14px; }
      .thumb-ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--dim-2); background: radial-gradient(120% 120% at 20% 10%, var(--surface-3), var(--img-bg)); }
      .thumb-ph svg { width: 44px; height: 44px; opacity: .7; }
      .thumb-ph .ph-id { position: absolute; bottom: 10px; right: 12px; font-weight: 800; font-size: 13px; color: var(--dim); }
      .avatar { border-radius: 50%; flex: none; display: inline-block; vertical-align: middle; background: var(--surface-3); }
      .rarity-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--dim); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }

      /* ---------- tables ---------- */
      .tbl-wrap { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; }
      .tbl-scroll { overflow-x: auto; }
      table.tbl { width: 100%; border-collapse: collapse; min-width: 780px; }
      table.tbl th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim-2); padding: 13px 16px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
      table.tbl td { padding: 13px 16px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; font-size: 14px; }
      table.tbl tr:last-child td { border-bottom: 0; }
      table.tbl tbody tr.clickable { cursor: pointer; }
      table.tbl tbody tr.clickable:hover td { background: var(--surface-2); }
      .tbl-item { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .tbl-item img, .tbl-item .mini-ph { width: 44px; height: 44px; border-radius: 11px; object-fit: cover; flex: none; background: var(--img-bg); }
      .mini-ph { display: grid; place-items: center; color: var(--dim-2); font-weight: 800; font-size: 11px; }
      .ev-kind { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; white-space: nowrap; }
      .ev-kind .ev-ic { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border-soft); display: grid; place-items: center; color: var(--dim); }
      .ev-kind .ev-ic svg { width: 13px; height: 13px; }
      .detail-row td { background: var(--surface-2); font-size: 13px; color: var(--dim); }
      .detail-grid { display: flex; gap: 26px; flex-wrap: wrap; }
      .detail-grid b { color: var(--text); }
      .pct-up { color: var(--green); font-weight: 700; }
      .pct-down { color: var(--red); font-weight: 700; }
      /* activity mobile cards */
      .act-cards { display: none; }
      @media (max-width: 820px) {
        .act-table-wrap { display: none; }
        .act-cards { display: flex; flex-direction: column; gap: 10px; }
      }
      .act-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 13px 14px; }
      .act-card-top { display: flex; gap: 12px; align-items: center; }
      .act-card-top img, .act-card-top .mini-ph { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex: none; background: var(--img-bg); }
      .act-lines { margin-top: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; font-size: 13px; }
      .act-lines .al-label { color: var(--dim-2); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; display: block; }
      .act-detail { margin-top: 11px; border-top: 1px solid var(--border-soft); padding-top: 10px; font-size: 13px; color: var(--dim); display: none; }
      .act-card.open .act-detail { display: block; }
      .text-btn { background: none; border: 0; color: var(--accent); font-weight: 800; font-size: 13px; padding: 8px 4px; min-height: 36px; }

      /* ---------- stats ---------- */
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
      .stat-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; }

              events.push(Object.assign({}, base, { kind: "offer-withdrawn", tokenId: topicToUint(log.topics[1]), from: topicToAddress(log.topics[2]), to: null, priceLoop: weiToLoop(wordToBigInt(dw[0])), feeLoop: null, royaltyLoop: null, royaltyReceiver: null }));
            } else if (t0 === TOPIC.offerAccepted) {
              events.push(Object.assign({}, base, { kind: "offer-accepted", tokenId: topicToUint(log.topics[1]), from: topicToAddress(log.topics[2]), to: topicToAddress(log.topics[3]), priceLoop: weiToLoop(wordToBigInt(dw[0])), feeLoop: null, royaltyLoop: null, royaltyReceiver: null }));
            }
          });
          events.sort(function (a, b) { return b.blockNumber - a.blockNumber || b.logIndex - a.logIndex; });
          salesAll.sort(function (a, b) { return b.blockNumber - a.blockNumber; });
          return { events: events.slice(0, 150), salesAll: salesAll, salesCount: salesCount, volumeWei: volumeWei };
        });
      });
    }
    function finishDerived(checkedAt) {
      S.checkedAt = checkedAt;
      S.loaded = true;
      // Rarity ranks from real trait frequencies.
      var freq = new Map();
      var scored = S.tokens.filter(function (t) { return t.traits.length > 0; });
      scored.forEach(function (t) {
        t.traits.forEach(function (tr) {
          var k = tr.label + ":" + tr.value;
          freq.set(k, (freq.get(k) || 0) + 1);
        });
      });
      var scores = scored.map(function (t) {
        return { id: t.tokenId, score: t.traits.reduce(function (s, tr) { return s + 1 / (freq.get(tr.label + ":" + tr.value) || 1); }, 0) };
      });
      scores.sort(function (a, b) { return b.score - a.score || a.id - b.id; });
      S.rarity = new Map();
      scores.forEach(function (s, i) { S.rarity.set(s.id, i + 1); });
      S.traitFreq = freq;
      // Holders + totals.
      var holderMap = new Map();
      S.tokens.forEach(function (t) {
        var key = t.owner.toLowerCase();
        var e = holderMap.get(key) || { address: t.owner, tokenCount: 0, listedCount: 0, floorValueLoop: 0 };
        e.tokenCount += 1;
        if (t.listing && t.listing.active) { e.listedCount += 1; e.floorValueLoop = Math.round((e.floorValueLoop + t.listing.priceLoop) * 1e8) / 1e8; }
        holderMap.set(key, e);
      });
      S.holders = Array.from(holderMap.values()).sort(function (a, b) { return b.tokenCount - a.tokenCount; });
      var activeListings = S.tokens.filter(function (t) { return t.listing && t.listing.active; });
      var volumeLoop = 0;
      S.salesAll.forEach(function (s) { volumeLoop += s.priceLoop; });
      S.totals = {
        minted: S.tokens.length,
        activeListings: activeListings.length,
        floorLoop: activeListings.length ? Math.min.apply(null, activeListings.map(function (t) { return t.listing.priceLoop; })) : null,
        owners: S.holders.length,
        salesCount: S.salesAll.length,
        volumeLoop: Math.round(volumeLoop * 1e8) / 1e8,
        activeOffers: S.tokens.filter(function (t) { return t.offer && t.offer.active; }).length
      };
    }
    function salesInWindow(hours) {
      var cutoff = Date.now() - hours * 3600 * 1000;
      return S.salesAll.filter(function (s) { return s.timestamp && new Date(s.timestamp).getTime() >= cutoff; });
    }
    function rankAccounts(role, hours) {
      // role: "buyer" | "seller". Ranked by real on-chain volume.
      var list = hours ? salesInWindow(hours) : S.salesAll;
      var map = new Map();
      list.forEach(function (s) {
        var addr = (role === "buyer" ? s.buyer : s.seller).toLowerCase();
        var e = map.get(addr) || { address: addr, volume: 0, trades: 0, tokenIds: [] };
        e.volume = Math.round((e.volume + s.priceLoop) * 1e8) / 1e8;
        e.trades += 1;
        e.tokenIds.push(s.tokenId);
        map.set(addr, e);
      });
      return Array.from(map.values()).sort(function (a, b) { return b.volume - a.volume || b.trades - a.trades; });
    }
</script>

    <script>
    /* ---------------- toasts ---------------- */
    function toast(kind, title, sub, sticky) {
      var box = document.getElementById("toasts");
      var el = document.createElement("div");
      el.className = "toast " + kind;
      var icon = kind === "ok"
        ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>'
        : kind === "err"
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
          : '<span class="spin"></span>';
      el.innerHTML = '<span class="t-ic">' + icon + '</span><span style="flex:1;min-width:0"><b>' + esc(title) + "</b>" +
        (sub ? '<span class="t-sub">' + sub + "</span>" : "") + "</span>";
      box.appendChild(el);
      if (!sticky) setTimeout(function () { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(function () { el.remove(); }, 320); }, kind === "err" ? 7000 : 4600);
      return el;
    }
    function toastTx(title, hash) {
      return toast("info", title, 'Waiting for confirmation · <a href="' + EXPLORER_URL + "/tx/" + hash + '" target="_blank" rel="noopener">view transaction ↗</a>', true);
    }

    /* ---------------- wallet ---------------- */
    function ethProvider() { return typeof window !== "undefined" ? window.ethereum : undefined; }
    function renderWalletSlot() {
      var slot = document.getElementById("wallet-slot");
      if (W.address) {
        slot.innerHTML = '<button class="wallet-btn" id="wallet-btn" title="Connected wallet — open your profile">' +
          '<span class="dot-live"></span><span class="addr">' + shortAddr(W.address) + "</span></button>";
        document.getElementById("wallet-btn").addEventListener("click", function () { location.hash = "#/profile/" + W.address; });
      } else {
        slot.innerHTML = '<button class="wallet-btn icon-only" id="wallet-btn" aria-label="Connect wallet" title="Connect wallet">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></button>';
        document.getElementById("wallet-btn").addEventListener("click", connectWallet);
      }
      renderDrawerProfile();
    }
    function renderDrawerProfile() {
      var box = document.getElementById("drawer-profile");
      if (!box) return;
      if (W.address) {
        box.innerHTML =
          '<div style="display:flex;gap:12px;align-items:center">' + avatarImg(W.address, 44) +
          '<div style="min-width:0"><div style="font-weight:800" class="addr">' + shortAddr(W.address) + '</div>' +
          '<div class="small dim">Balance: ' + (W.balanceLoop !== null ? fmt(W.balanceLoop) + " LOOP" : "—") + "</div></div></div>" +
          '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<a class="btn btn-primary btn-sm" style="flex:1" href="#/profile/' + W.address + '">View profile</a>' +
          '<button class="btn btn-ghost btn-sm" id="drawer-disconnect">Disconnect</button></div>';
        var d = document.getElementById("drawer-disconnect");
        if (d) d.addEventListener("click", function () { disconnectWallet(); });
      } else {
        box.innerHTML =
          '<div style="font-weight:800">No wallet connected</div>' +
          '<div class="small dim" style="margin-top:3px">Connect MetaMask or Brave Wallet to buy, list, offer and mint on Loop Network.</div>' +
          '<button class="btn btn-primary btn-block" id="drawer-connect" style="margin-top:12px">Connect Wallet</button>';
        var c = document.getElementById("drawer-connect");
        if (c) c.addEventListener("click", connectWallet);
      }
    }
    function refreshBalance() {
      if (!W.address) { W.balanceLoop = null; return; }
      rpcSingle("eth_getBalance", [W.address, "latest"]).then(function (hex) {
        if (typeof hex === "string") { W.balanceLoop = weiToLoop(BigInt(hex)); renderWalletSlot(); }
      });
    }
    function ensureLoopChain() {
      var eth = ethProvider();
      if (!eth) return Promise.resolve(false);
      return eth.request({ method: "eth_chainId" }).then(function (id) {
        if (String(id).toLowerCase() === CHAIN_HEX) return true;
        return eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_HEX }] })
          .then(function () { return true; })
          .catch(function (err) {
            if (err && err.code === 4902) {
              return eth.request({
                method: "wallet_addEthereumChain",
                params: [{
                  chainId: CHAIN_HEX, chainName: "Loop Network Mainnet",
                  nativeCurrency: { name: "LOOP", symbol: "LOOP", decimals: 18 },
                  rpcUrls: [RPC_URL], blockExplorerUrls: [EXPLORER_URL]
                }]
              }).then(function () { return true; }).catch(function () { return false; });
            }
            return false;
          });
      }).catch(function () { return false; });
    }
    function connectWallet() {
      var eth = ethProvider();
      if (!eth) {
        toast("err", "No wallet found", "Open this page in a browser with MetaMask or Brave Wallet installed — wallet connection needs a real https origin and an injected wallet.");
        return;
      }
      eth.request({ method: "eth_requestAccounts" }).then(function (accounts) {
        if (!accounts || !accounts[0]) throw new Error("No account returned");
        W.address = accounts[0].toLowerCase();
        return ensureLoopChain().then(function (ok) {
          renderWalletSlot(); refreshBalance();
          if (ok) toast("ok", "Wallet connected", "Connected as " + shortAddr(W.address) + " on Loop Network Mainnet.");
          else toast("err", "Wrong network", "Please switch your wallet to Loop Network Mainnet (Chain ID 15551) before signing transactions.");
          rerender();
        });
      }).catch(function (err) {
        toast("err", "Connection rejected", esc(err && err.message ? String(err.message).slice(0, 140) : "The wallet did not connect."));
      });
    }
    function disconnectWallet() {
      W.address = null; W.balanceLoop = null;
      renderWalletSlot();
      toast("info", "Wallet disconnected", "This only clears the connection in this page — nothing on-chain changes.");
      rerender();
    }
    function initWalletListeners() {
      var eth = ethProvider();
      if (!eth || !eth.on) return;
      eth.on("accountsChanged", function (accounts) {
        W.address = accounts && accounts[0] ? accounts[0].toLowerCase() : null;
        W.balanceLoop = null;
        renderWalletSlot(); refreshBalance(); rerender();
      });
      eth.on("chainChanged", function () { refreshBalance(); });
      // Silent reconnect when the wallet already authorised this origin.
      eth.request({ method: "eth_accounts" }).then(function (accounts) {
        if (accounts && accounts[0]) { W.address = accounts[0].toLowerCase(); renderWalletSlot(); refreshBalance(); rerender(); }
      }).catch(function () { /* not authorised yet */ });
    }

    /* ---------------- transactions ---------------- */
    function waitForReceipt(hash) {
      var tries = 0;
      return new Promise(function (resolve) {
        (function poll() {
          tries += 1;
          rpcSingle("eth_getTransactionReceipt", [hash]).then(function (r) {
            if (r) { resolve(r); return; }
            if (tries > 40) { resolve(null); return; }
            setTimeout(poll, 2500);
          });
        })();
      });
    }
    function sendTx(label, to, data, valueWei) {
      var eth = ethProvider();
      if (!eth || !W.address) { toast("err", "Connect your wallet first", "Buying, listing, offering and minting are signed by your own wallet."); return Promise.resolve(null); }
      if (W.busy) { toast("info", "A transaction is already in progress", "Wait for " + W.busyLabel + " to finish in your wallet."); return Promise.resolve(null); }
      return ensureLoopChain().then(function (ok) {
        if (!ok) { toast("err", "Wrong network", "Switch your wallet to Loop Network Mainnet (Chain ID 15551) and try again."); return null; }
        W.busy = true; W.busyLabel = label; rerender();
        var tx = { from: W.address, to: to, data: data };
        if (valueWei && valueWei > 0n) tx.value = "0x" + valueWei.toString(16);
        return eth.request({ method: "eth_sendTransaction", params: [tx] }).then(function (hash) {
          var pending = toastTx(label + " — submitted", hash);
          return waitForReceipt(hash).then(function (receipt) {
            pending.remove();
            W.busy = false; W.busyLabel = "";
            if (receipt && receipt.status === "0x1") {
              toast("ok", label + " — confirmed", 'On-chain in block ' + parseInt(receipt.blockNumber, 16).toLocaleString("en-US") + '. <a href="' + EXPLORER_URL + "/tx/" + hash + '" target="_blank" rel="noopener">View on the explorer ↗</a>');
              refreshBalance();
              setTimeout(function () { loadMarketplace().then(rerender); }, 2500);
              return receipt;
            }
            if (receipt) toast("err", label + " — reverted", "The transaction was mined but reverted. Check it on the explorer for details.");
            else toast("err", label + " — not confirmed yet", "No receipt after 100 seconds. Check the transaction on the explorer before retrying.");
            rerender();
            return null;
          });
        }).catch(function (err) {
          W.busy = false; W.busyLabel = "";
          var msg = err && err.code === 4001 ? "You rejected the signature in your wallet." : (err && err.message ? String(err.message).slice(0, 160) : "The wallet refused the transaction.");
          toast("err", label + " — not sent", esc(msg));
          rerender();
          return null;
        });
      });
    }
    function isApprovedForMarketplace(tokenId) {
      var specs = [
        ethCall(NFT_CONTRACT, SEL.getApproved + padUint(tokenId)),
        ethCall(NFT_CONTRACT, SEL.isApprovedForAll + addrWord(W.address) + addrWord(MARKETPLACE_CONTRACT))
      ];
      return rpcBatch(specs).then(function (res) {
        var approved = typeof res[0] === "string" ? wordToAddress(hexWords(res[0])[0]) : ZERO_ADDRESS;
        var forAll = typeof res[1] === "string" ? wordToBigInt(hexWords(res[1])[0]) === 1n : false;
        return approved.toLowerCase() === MARKETPLACE_CONTRACT.toLowerCase() || forAll;
      });
    }
    function ensureApproval(tokenId) {
      return isApprovedForMarketplace(tokenId).then(function (ok) {
        if (ok) return true;
        return sendTx("Approve marketplace for #" + tokenId, NFT_CONTRACT, SEL.approve + addrWord(MARKETPLACE_CONTRACT) + uintWord(tokenId), 0n)
          .then(function (r) { return !!r; });
      });
    }
    function txBuy(token) {
      if (!token.listing || !token.listing.active) return;
      sendTx("Buy " + tokenTitle(token), MARKETPLACE_CONTRACT, SEL.buy + uintWord(token.tokenId), loopNumberToWei(token.listing.priceLoop));
    }
    function txCancelListing(token) {
      sendTx("Cancel listing #" + token.tokenId, MARKETPLACE_CONTRACT, SEL.cancelListing + uintWord(token.tokenId), 0n);
    }
    function txList(token, priceInput) {
      var wei = parseLoopToWei(priceInput);
      if (!wei) { toast("err", "Enter a valid price", "The listing price must be a LOOP amount above zero, for example 0.25."); return; }
      ensureApproval(token.tokenId).then(function (ok) {
        if (!ok) return;
        sendTx("List " + tokenTitle(token), MARKETPLACE_CONTRACT, SEL.list + uintWord(token.tokenId) + wei.toString(16).padStart(64, "0"), 0n);
      });
    }
    function txMakeOffer(token, amountInput) {
      var wei = parseLoopToWei(amountInput);
      if (!wei) { toast("err", "Enter a valid offer", "The offer amount must be a LOOP amount above zero. The full amount is escrowed in the marketplace contract."); return; }
      sendTx("Offer on " + tokenTitle(token), MARKETPLACE_CONTRACT, SEL.makeOffer + uintWord(token.tokenId), wei);
    }
    function txWithdrawOffer(token) {
      sendTx("Withdraw offer on #" + token.tokenId, MARKETPLACE_CONTRACT, SEL.withdrawOffer + uintWord(token.tokenId), 0n);
    }
    function txAcceptOffer(token) {
      ensureApproval(token.tokenId).then(function (ok) {
        if (!ok) return;
        sendTx("Accept offer on " + tokenTitle(token), MARKETPLACE_CONTRACT, SEL.acceptOffer + uintWord(token.tokenId), 0n);
      });
    }

    /* ---------------- shared UI pieces ---------------- */
    function addrLink(address, opts) {
      opts = opts || {};
      if (!address) return '<span class="dim">—</span>';
      var label = opts.full ? address : shortAddr(address);
      return '<button class="addr-btn" data-profile="' + esc(address.toLowerCase()) + '" title="' + esc(address) + '">' + esc(label) + "</button>";
    }
    function addrWithAvatar(address, px) {
      if (!address) return '<span class="dim">—</span>';
      return '<span style="display:inline-flex;align-items:center;gap:8px;min-width:0">' + avatarImg(address, px || 24) + addrLink(address) + "</span>";
    }
    function tokenCardHtml(token) {
      var priceHtml = token.listing && token.listing.active
        ? '<span class="p-label">Price</span><span class="p-value tnum">' + fmt(token.listing.priceLoop) + " LOOP</span>"
        : '<span class="p-label">Price</span><span class="p-value dim" style="font-weight:600">Not listed</span>';
      var rank = S.rarity.get(token.tokenId);
      return '<button class="nft-card" data-token="' + token.tokenId + '">' +
        '<span class="nft-media" style="display:block">' + tokenImgHtml(token) + "</span>" +
        '<span class="nft-body" style="display:block">' +
        '<span class="nft-name" style="display:block">' + esc(tokenTitle(token)) + "</span>" +
        '<span class="nft-sub" style="display:block">' + esc(S.contracts ? S.contracts.nftName : "Loop Market NFT") + " · #" + token.tokenId + (rank ? ' · <span title="Rarity rank from on-chain trait frequencies">Rarity #' + rank + "</span>" : "") + "</span>" +
        '<span class="nft-price" style="display:flex">' + priceHtml + "</span>" +
        "</span></button>";
    }
    function bindTokenCards(root) {
      root.querySelectorAll("[data-token]").forEach(function (el) {
        el.addEventListener("click", function () { location.hash = "#/token/" + el.getAttribute("data-token"); });
      });
      root.querySelectorAll("[data-profile]").forEach(function (el) {
        el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          location.hash = "#/profile/" + el.getAttribute("data-profile");
        });
      });
    }
    function copyText(text, label) {
      function done() { toast("ok", (label || "Copied") + " copied", esc(text)); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
      } else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) { /* clipboard unavailable */ }
      ta.remove();
    }
    function statusLineHtml() {
      if (!S.loaded) return "";
      if (!S.online) return '<div class="status-line off"><span class="pulse"></span>Loop Network RPC unreachable — showing nothing rather than stale data. The page retries automatically.</div>';
      return '<div class="status-line"><span class="pulse"></span>Live from Loop Network · Block ' + S.blockNumber.toLocaleString("en-US") + " · " + S.totals.minted + " tokens read on-chain</div>";
    }
    function loadingHtml(label) {
      return '<div class="page"><h1 class="page-title">' + esc(label || "Loop Market") + '</h1>' +
        '<div class="status-line"><span class="spin" style="color:var(--accent)"></span>Reading the live contracts on Loop Network…</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:20px"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>';
    }
    function offlineHtml() {
      return '<div class="page"><h1 class="page-title">Cannot reach Loop Network</h1>' +
        '<div class="empty-note" style="margin-top:16px">' + esc(S.loadError || "The RPC did not answer.") + "<br/><br/>This marketplace has no cached or demo data — when the chain answers again, everything appears here live. Retrying automatically…</div></div>";
    }
  </script>

    <script>
    /* ================= EXPLORE ================= */
    var exploreState = { heroWindow: 7, heroIndex: 0, rankTab: "buyers", heroTimer: null };

    function heroSlides() {
      // One slide per distinct artwork, ordered by each token's real sales
      // volume (then its best single sale). With a single live collection,
      // every slide presents that collection featuring a different token.
      var volByToken = new Map(), bestByToken = new Map();
      S.salesAll.forEach(function (s) {
        volByToken.set(s.tokenId, Math.round(((volByToken.get(s.tokenId) || 0) + s.priceLoop) * 1e8) / 1e8);
        bestByToken.set(s.tokenId, Math.max(bestByToken.get(s.tokenId) || 0, s.priceLoop));
      });
      var ranked = S.tokens.slice().sort(function (a, b) {
        var dv = (volByToken.get(b.tokenId) || 0) - (volByToken.get(a.tokenId) || 0);
        if (dv !== 0) return dv;
        var db = (bestByToken.get(b.tokenId) || 0) - (bestByToken.get(a.tokenId) || 0);
        if (db !== 0) return db;
        return b.tokenId - a.tokenId;
      });
      var seen = {}, slides = [];
      ranked.forEach(function (t) {
        if (slides.length >= 7) return;
        var key = artworkKey(t);
        if (seen[key]) return;
        seen[key] = true;
        slides.push({ token: t, topSale: bestByToken.get(t.tokenId) || null });
      });
      return slides;
    }
    function heroVolume() {
      var sales = salesInWindow(exploreState.heroWindow === 1 ? 24 : 24 * 7);
      var vol = 0;
      sales.forEach(function (s) { vol += s.priceLoop; });
      return Math.round(vol * 1e8) / 1e8;
    }
    function renderExplore(app) {
      if (!S.loaded) { app.innerHTML = loadingHtml("The live NFT marketplace on Loop Network"); return; }
      if (!S.online) { app.innerHTML = offlineHtml(); return; }
      var slides = heroSlides();
      var collName = S.contracts.nftName;
      var vol = heroVolume();
      var creator = S.contracts.nftOwner;
      var slideHtml = slides.map(function (sl, i) {
        var t = sl.token;
        return '<div class="car-slide"><button class="hero-card" data-token="' + t.tokenId + '">' +
          '<span class="hero-media" style="display:block">' + tokenImgHtml(t) +
          '<span class="hero-shade"></span>' +
          (sl.topSale !== null ? '<span class="hero-chip">Top sale · ' + fmt(sl.topSale) + " LOOP</span>" : "") +
          '<span class="hero-body" style="display:block">' +
          '<span class="hero-coll" style="display:block">' + esc(collName) + VERIFIED_SVG + "</span>" +
          '<span class="hero-by" style="display:block">Featuring ' + esc(tokenTitle(t)) + " · By " + esc(shortAddr(creator)) + "</span>" +
          '<span class="hero-stats" style="display:flex">' +
          '<span><span class="hs-label" style="display:block">FLOOR PRICE</span><span class="hs-value tnum" style="display:block">' + (S.totals.floorLoop !== null ? fmt(S.totals.floorLoop) + " LOOP" : "—") + "</span></span>" +
          '<span><span class="hs-label" style="display:block">ITEMS</span><span class="hs-value tnum" style="display:block">' + S.totals.minted + "</span></span>" +
          '<span><span class="hs-label" style="display:block">TOTAL VOLUME (' + (exploreState.heroWindow === 1 ? "1D" : "7D") + ')</span><span class="hs-value tnum" style="display:block">' + fmt(vol) + " LOOP</span></span>" +
          "</span></span></span></button></div>";
      }).join("");
      var dots = slides.map(function (_, i) {
        return '<button class="car-dot-wrap" data-hero-dot="' + i + '" aria-label="Go to slide ' + (i + 1) + '"><span class="car-dot' + (i === 0 ? " active" : "") + '"></span></button>';
      }).join("");
      var rankSection = renderRankSection();

    function renderRankSection() {

    function initHeroCarousel(count) {
      var track = document.getElementById("hero-track");
      if (!track || count === 0) return;
      if (exploreState.heroTimer) { clearInterval(exploreState.heroTimer); exploreState.heroTimer = null; }
      // Infinite loop: clone the first and last slides around the real ones.
      var slides = Array.prototype.slice.call(track.children);
      if (count > 1) {
        var firstClone = slides[0].cloneNode(true);
        var lastClone = slides[slides.length - 1].cloneNode(true);
        firstClone.setAttribute("aria-hidden", "true");
        lastClone.setAttribute("aria-hidden", "true");
        track.appendChild(firstClone);
        track.insertBefore(lastClone, slides[0]);

      var idx = 0; // logical slide index
      var pos = 1; // physical position (offset by the leading clone)
      function apply(animate) {
        track.style.transition = animate === false ? "none" : "";

        dots.forEach(function (d, i) { d.classList.toggle("active", i === idx); });
      }
      function go(delta) {
        if (count <= 1) return;
        idx = (idx + delta + count) % count;
        pos += delta;
        apply(true);
      }
      // Start on the first real slide.
      track.style.transition = "none";
      track.style.transform = "translateX(-100%)";
      if (count <= 1) { track.style.transform = "translateX(0)"; pos = 0; }
      track.addEventListener("transitionend", function () {
        if (count <= 1) return;
        if (pos === 0) { pos = count; apply(false); }
        else if (pos === count + 1) { pos = 1; apply(false); }
      });
      // Rebind cloned slides' click targets.
      track.querySelectorAll("[data-token]").forEach(function (el) {

      });
      var prev = document.getElementById("hero-prev"), next = document.getElementById("hero-next");

          exploreState.heroTimer = setInterval(function () {
            if (document.hidden || !document.getElementById("hero-track")) { clearInterval(exploreState.heroTimer); exploreState.heroTimer = null; return; }
            go(1);
          }, 5200);
        }

      restart();
      exploreState.heroIndex = 0;

    /* ================= COLLECTION ================= */
    function dailyVolumes(days) {
      var out = [];
      var now = new Date();
      for (var i = days - 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        var next = new Date(d.getTime() + 86400000);

        S.salesAll.forEach(function (s) {
          if (!s.timestamp) return;
          var t = new Date(s.timestamp).getTime();
          if (t >= d.getTime() && t < next.getTime()) { vol += s.priceLoop; count += 1; }
        });
        out.push({ day: d, volume: Math.round(vol * 1e8) / 1e8, count: count });
      }
      return out;

    function sparklineSvg(values, w, h) {
      if (!values.length) return '<span class="dim">—</span>';

        var x = Math.round(i * step * 10) / 10;
        var y = Math.round((h - 4 - (v / max) * (h - 10)) * 10) / 10;
        return x + "," + y;

      return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (up ? "var(--green)" : "var(--red)") + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';

    /* ================= STATISTICS ================= */

        '<div class="stat-card"><div class="sc-label">Total volume</div><div class="sc-value tnum">' + fmt(t.volumeLoop) + '</div><div class="sc-sub">LOOP · all sales</div></div>' +

        '<div class="stat-card"><div class="sc-label">Active offers</div><div class="sc-value tnum">' + t.activeOffers + '</div><div class="sc-sub">Escrowed in the contract</div></div>' +

        '<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Trading activity</h3>' +
        '<span class="seg"><button data-stats-win="1" class="' + (statsState.window === 1 ? "active" : "") + '">1D</button><button data-stats-win="7" class="' + (statsState.window === 7 ? "active" : "") + '">7D</button></span></div>' +
        '<div style="display:flex;gap:34px;flex-wrap:wrap"><span><span class="small dim" style="display:block">Volume (' + (statsState.window === 1 ? "24h" : "7d") + ')</span><b class="tnum" style="font-size:20px">' + fmt(winVol) + ' LOOP</b></span>' +
        '<span><span class="small dim" style="display:block">Sales (' + (statsState.window === 1 ? "24h" : "7d") + ')</span><b class="tnum" style="font-size:20px">' + win.length + "</b></span></div>" +
        '<div class="bar-chart">' + days.map(function (d) {

          var lab = d.day.toLocaleDateString("en-US", { weekday: "short" });
          return '<div class="bar-col"><span class="bar-val tnum">' + (d.volume ? fmt(d.volume) : "") + '</span><span class="bar" style="height:' + h + 'px" title="' + fmt(d.volume) + ' LOOP · ' + d.count + ' sales"></span><span class="bar-lab">' + lab + "</span></div>";
        }).join("") + "</div>" +

        '<div class="two-col">' +
        '<div class="panel"><div class="panel-head"><h3>Top collections</h3></div>' +

        '<span class="lr-main"><span class="lr-title">' + esc(S.contracts.nftName) + VERIFIED_SVG + '</span><span class="lr-sub">Floor ' + (coll.floor !== null ? fmt(coll.floor) + " LOOP" : "—") + " · " + coll.supply + ' items · ' + coll.owners + ' owners</span></span>' +
        '<span class="lr-value tnum">' + fmt(t.volumeLoop) + ' LOOP<span class="lr-sub">total volume</span></span></div></div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Top holders</h3></div>' +
        (S.holders.length ? '<div class="list-rows">' + S.holders.slice(0, 10).map(function (h, i) {
          return '<div class="list-row"><span style="font-weight:800;color:var(--dim-2);width:22px">#' + (i + 1) + "</span>" + avatarImg(h.address, 32) +
            '<span class="lr-main"><span class="lr-title">' + addrLink(h.address) + '</span><span class="lr-sub">' + h.listedCount + ' listed</span></span>' +
            '<span class="lr-value tnum">' + h.tokenCount + (h.tokenCount === 1 ? " NFT" : " NFTs") + "</span></div>";
        }).join("") + "</div>" : '<div class="empty-note" style="padding:20px">No holders yet.</div>') +
        "</div></div>" +
        '<div class="two-col">' +
        '<div class="panel"><div class="panel-head"><h3>Top sellers</h3><span class="small dim">by volume</span></div>' + accountRows(sellers, "seller") + "</div>" +
        '<div class="panel"><div class="panel-head"><h3>Top buyers</h3><span class="small dim">by volume</span></div>' + accountRows(buyers, "buyer") + "</div>" +
        "</div>" +
        '<h2 class="section-title">Recent sales <span class="hint">Newest first · real transaction hashes</span></h2>' +
        (recent.length ? '<div class="panel" style="padding:6px 18px"><div class="list-rows">' + recent.map(function (s) {
          var tk = S.tokenById.get(s.tokenId);
          return '<div class="list-row">' + (tk ? tokenImgHtml(tk) : '<span class="mini-ph">#' + s.tokenId + "</span>") +
            '<span class="lr-main"><span class="lr-title">' + (tk ? esc(tokenTitle(tk)) : "LMNFT #" + s.tokenId) + '</span><span class="lr-sub">' + addrLink(s.seller) + " → " + addrLink(s.buyer) + (s.viaOffer ? " · via offer" : "") + '</span></span>' +
            '<span class="lr-value tnum">' + fmt(s.priceLoop) + ' LOOP<span class="lr-sub">' + timeAgo(s.timestamp) + ' · <a href="' + EXPLORER_URL + "/tx/" + s.txHash + '" target="_blank" rel="noopener">tx ↗</a></span></span></div>';
        }).join("") + "</div></div>" : '<div class="empty-note">No sales on-chain yet.</div>') +

      app.querySelectorAll("[data-stats-win]").forEach(function (b) {

    <script>
    /* ================= TOKEN DETAIL ================= */
    function renderToken(app, tokenId) {
      if (!S.loaded) { app.innerHTML = loadingHtml("NFT #" + tokenId); return; }
      if (!S.online) { app.innerHTML = offlineHtml(); return; }
      var t = S.tokenById.get(tokenId);
      if (!t) {
        app.innerHTML = '<div class="page"><h1 class="page-title">Token #' + tokenId + ' not found</h1><div class="empty-note" style="margin-top:14px">The chain reports no token with this ID in the Loop Market NFT contract. It may not have been minted yet.</div><p style="margin-top:16px"><a class="btn btn-ghost" href="#/explore">Back to Explore</a></p></div>';
        return;
      }
      var me = W.address;
      var isOwner = me && t.owner.toLowerCase() === me;
      var isSeller = t.listing && t.listing.active && me && t.listing.seller.toLowerCase() === me;
      var myOffer = t.offer && t.offer.active && me && t.offer.offerer.toLowerCase() === me;
      var rank = S.rarity.get(t.tokenId);
      var history = S.events.filter(function (e) { return e.tokenId === t.tokenId; });
      var sales = S.salesAll.filter(function (s) { return s.tokenId === t.tokenId; });
      var lastSale = sales.length ? sales[0] : null;
      var busy = W.busy ? ' disabled title="A transaction is in progress"' : "";
      var actionBox = "";
      if (t.listing && t.listing.active) {
        actionBox += '<div class="price-box"><div class="small dim" style="font-weight:800;letter-spacing:.06em">CURRENT PRICE</div>' +
          '<div class="price-big tnum">' + fmt(t.listing.priceLoop) + ' <span style="font-size:17px">LOOP</span></div>' +
          '<div class="small dim">Seller ' + addrLink(t.listing.seller) + " · Marketplace fee 2.5% and the creator royalty are deducted from the seller — you pay the price plus gas.</div>";
        if (isSeller) {
          actionBox += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-danger" id="tx-cancel"' + busy + ">Cancel listing</button></div>";
        } else if (isOwner) {
          actionBox += '<p class="small dim" style="margin-top:12px">You own this token, but the active listing belongs to a previous owner — it no longer settles against your wallet. Cancel is only possible from the seller wallet.</p>';
        } else {
          actionBox += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-primary" id="tx-buy"' + busy + ">" + (me ? "Buy now" : "Connect wallet to buy") + "</button></div>";
        }
        actionBox += "</div>";
      } else if (isOwner) {
        actionBox += '<div class="price-box"><div style="font-weight:800;font-size:16px">List this NFT for sale</div>' +
          '<p class="small dim">The NFT stays in your wallet until it sells. The marketplace contract takes 2.5% and the creator royalty ' + fmt(t.royaltyPercent) + '% from your proceeds.</p>' +
          '<div class="inline-form"><input class="input" id="list-price" inputmode="decimal" placeholder="Price in LOOP, e.g. 0.25" aria-label="Listing price in LOOP" />' +
          '<button class="btn btn-primary" id="tx-list"' + busy + ">List for sale</button></div></div>";
      } else {
        actionBox += '<div class="price-box"><div style="font-weight:800;font-size:16px">Not listed</div><p class="small dim" style="margin:6px 0 0">This token is not for sale at a fixed price. You can still make an offer below — the owner can accept it at any time.</p></div>';
      }
      // Offer box
      var offerBox = '<div class="price-box"><div style="font-weight:800;font-size:16px">Offers</div>';
      if (t.offer && t.offer.active) {
        offerBox += '<div class="kv"><span class="k">Open offer</span><span class="v tnum">' + fmt(t.offer.amountLoop) + " LOOP</span></div>" +
          '<div class="kv"><span class="k">From</span><span class="v">' + addrLink(t.offer.offerer) + "</span></div>" +
          '<p class="small dim">The full amount is escrowed in the marketplace contract. Only one offer can be open per token.</p>';
        if (isOwner) offerBox += '<button class="btn btn-primary" id="tx-accept"' + busy + ">Accept offer</button> ";
        if (myOffer) offerBox += '<button class="btn btn-ghost" id="tx-withdraw"' + busy + ">Withdraw my offer</button>";
      } else {
        offerBox += '<p class="small dim">No open offer on this token.</p>';
        if (!isOwner) {
          offerBox += '<div class="inline-form"><input class="input" id="offer-amount" inputmode="decimal" placeholder="Offer in LOOP, e.g. 0.05" aria-label="Offer amount in LOOP" />' +
            '<button class="btn btn-primary" id="tx-offer"' + busy + ">" + (me ? "Make offer" : "Connect wallet to offer") + "</button></div>" +
            '<p class="small dim" style="margin-top:8px">Your LOOP is escrowed in the contract until you withdraw the offer or the owner accepts it.</p>';
        } else {
          offerBox += '<p class="small dim">You own this token — offers from other wallets will appear here.</p>';
        }
      }
      offerBox += "</div>";
      app.innerHTML =
        '<div class="page">' +
        '<p class="small" style="margin:0 0 14px"><a href="#/collection-profile">' + esc(S.contracts.nftName) + "</a> <span class='dim'>/</span> <span class='dim'>#" + t.tokenId + "</span></p>" +
        '<div class="token-layout"><div><div class="token-media">' + tokenImgHtml(t) + "</div>" +
        '<div class="panel" style="margin-top:16px"><h3>Details</h3>' +
        '<div class="kv"><span class="k">Contract</span><span class="v addr">' + shortAddr(NFT_CONTRACT) + ' <button class="copy-btn" data-copy="' + NFT_CONTRACT + '">Copy</button></span></div>' +
        '<div class="kv"><span class="k">Token ID</span><span class="v">#' + t.tokenId + "</span></div>" +
        '<div class="kv"><span class="k">Standard</span><span class="v">ERC-721 · ERC-2981 royalties</span></div>' +
        '<div class="kv"><span class="k">Creator royalty</span><span class="v">' + fmt(t.royaltyPercent) + "% → " + shortAddr(t.royaltyReceiver) + "</span></div>" +
        '<div class="kv"><span class="k">Metadata</span><span class="v">' + (t.metadataStatus === "resolved" ? "Resolved" : "Not published / unreachable") + "</span></div>" +
        '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="' + EXPLORER_URL + "/token/" + NFT_CONTRACT + "/" + t.tokenId + '" target="_blank" rel="noopener">View on explorer ↗</a>' +
        (t.externalUrl ? '<a class="btn btn-ghost btn-sm" href="' + esc(t.externalUrl) + '" target="_blank" rel="noopener">Creator link ↗</a>' : "") + "</div></div></div>" +
        '<div><h1 class="page-title" style="margin-top:0">' + esc(tokenTitle(t)) + VERIFIED_SVG + "</h1>" +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="small dim">Owned by</span>' + addrWithAvatar(t.owner, 26) +
        (rank ? '<span class="rarity-chip">Rarity rank #' + rank + " of " + S.rarity.size + "</span>" : "") +
        (lastSale ? '<span class="rarity-chip">Last sale ' + fmt(lastSale.priceLoop) + " LOOP</span>" : "") + "</div>" +
        (t.description ? '<p style="margin-top:14px;max-width:640px">' + esc(t.description) + "</p>" : "") +
        actionBox + offerBox +
        (t.traits.length ? '<h2 class="section-title" style="font-size:18px">Traits</h2><div class="trait-grid">' + t.traits.map(function (tr) {
          var f = S.traitFreq ? S.traitFreq.get(tr.label + ":" + tr.value) || 0 : 0;
          var pct = S.totals.minted ? Math.round((f / S.totals.minted) * 1000) / 10 : 0;
          return '<div class="trait"><div class="t-label">' + esc(tr.label) + '</div><div class="t-value">' + esc(tr.value) + '</div><div class="t-freq">' + f + " of " + S.totals.minted + " · " + pct + "%</div></div>";
        }).join("") + "</div>" : "") +
        '<h2 class="section-title" style="font-size:18px">History</h2>' +
        (history.length ? '<div class="panel" style="padding:6px 18px"><div class="list-rows">' + history.map(function (e) {
          return '<div class="list-row"><span class="ev-kind">' + evIcon(e.kind) + '</span><span class="lr-main"><span class="lr-title">' + evLabel(e.kind) + '</span><span class="lr-sub">' +
            (e.from ? addrLink(e.from) : "") + (e.to ? " → " + addrLink(e.to) : "") + '</span></span>' +
            '<span class="lr-value tnum">' + (e.priceLoop !== null ? fmt(e.priceLoop) + " LOOP" : "—") + '<span class="lr-sub">' + timeAgo(e.timestamp) + ' · <a href="' + e.explorerUrl + '" target="_blank" rel="noopener">tx ↗</a></span></span></div>';
        }).join("") + "</div></div>" : '<div class="empty-note">No on-chain events for this token yet.</div>') +
        "</div></div></div>";
      bindTokenCards(app);
      app.querySelectorAll("[data-copy]").forEach(function (b) {
        b.addEventListener("click", function () { copyText(b.getAttribute("data-copy"), "Address"); });
      });
      var buy = document.getElementById("tx-buy");
      if (buy) buy.addEventListener("click", function () { if (!W.address) { connectWallet(); return; } txBuy(t); });
      var cancel = document.getElementById("tx-cancel");
      if (cancel) cancel.addEventListener("click", function () { txCancelListing(t); });
      var list = document.getElementById("tx-list");
      if (list) list.addEventListener("click", function () { txList(t, document.getElementById("list-price").value); });
      var offer = document.getElementById("tx-offer");
      if (offer) offer.addEventListener("click", function () { if (!W.address) { connectWallet(); return; } txMakeOffer(t, document.getElementById("offer-amount").value); });
      var accept = document.getElementById("tx-accept");
      if (accept) accept.addEventListener("click", function () { txAcceptOffer(t); });
      var withdraw = document.getElementById("tx-withdraw");
      if (withdraw) withdraw.addEventListener("click", function () { txWithdrawOffer(t); });
    }

    /* ================= PROFILE ================= */

    function doMint(app) {
      var uri;
      if (createState.mode === "ipfs") {
        uri = document.getElementById("mint-ipfs-uri").value.trim();
        if (uri.indexOf("ipfs://") !== 0) { toast("err", "Paste your IPFS metadata URI", "It should start with ipfs:// — pin the metadata JSON first, then paste its URI."); return; }
      } else {
        var name = document.getElementById("mint-name").value.trim();
        var desc = document.getElementById("mint-desc").value.trim();
        var image = createState.imageDataUrl || document.getElementById("mint-image-url").value.trim();
        if (!name) { toast("err", "Give your NFT a name", "The name is part of the on-chain metadata and cannot be changed later."); return; }
        if (!image) { toast("err", "Add an image", "Upload an image file or paste an image URL / ipfs:// URI / CID."); return; }
        if (/^(Qm[1-9A-HJ-NP-Za-km-z]{44}|baf[a-z0-9]{20,})$/.test(image)) image = "ipfs://" + image;
        var traits = [];
        app.querySelectorAll("#trait-rows .inline-form").forEach(function (row) {
          var l = row.querySelector(".trait-label").value.trim();
          var v = row.querySelector(".trait-value").value.trim();
          if (l && v) traits.push({ trait_type: l, value: v });
        });
        var meta = { name: name, description: desc, image: image };
        if (traits.length) meta.attributes = traits;
        uri = toDataUri(meta);
      }
      var listPrice = document.getElementById("mint-list-price").value.trim();
      sendTx("Mint NFT", NFT_CONTRACT, encodeMint(W.address, uri), 0n).then(function (receipt) {
        if (!receipt) return;
        // The new token ID is in the Minted event of the receipt.
        var newId = null;
        (receipt.logs || []).forEach(function (log) {
          if ((log.topics[0] || "").toLowerCase() === TOPIC.minted) newId = topicToUint(log.topics[1]);
        });
        if (newId === null) {
          (receipt.logs || []).forEach(function (log) {
            if ((log.topics[0] || "").toLowerCase() === TOPIC.transfer && topicToAddress(log.topics[1]) === ZERO_ADDRESS) newId = topicToUint(log.topics[3]);
          });
        }
        loadMarketplace().then(function () {
          rerender();
          if (newId !== null) {
            toast("ok", "NFT minted", 'Your token is LMNFT #' + newId + '. <a href="#/token/' + newId + '">Open it</a>');
            if (listPrice) {
              var wei = parseLoopToWei(listPrice);
              if (wei) {
                toast("info", "One more step to list it", "Approve the marketplace, then sign the listing for #" + newId + " at " + listPrice + " LOOP.");
                ensureApproval(newId).then(function (ok) {
                  if (!ok) return;
                  sendTx("List LMNFT #" + newId, MARKETPLACE_CONTRACT, SEL.list + uintWord(newId) + wei.toString(16).padStart(64, "0"), 0n);
                });
              }
            } else {
              location.hash = "#/token/" + newId;
            }
          }
        });
      });
    }
