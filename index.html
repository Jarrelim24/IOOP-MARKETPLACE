        var price = parseFloat(priceInput.value);
        var out = document.getElementById("calc-out");
        if (!price || price <= 0) { out.innerHTML = '<p class="small dim" style="grid-column:1/-1;margin:0">Enter a sale price to see the exact split the contract will make.</p>'; return; }
        var fee = price * feePct / 100;
        var roy = price * royalty / 100;
        var seller = price - fee - roy;
        out.innerHTML =
          '<div class="calc-cell"><div class="cc-label">Buyer pays</div><div class="cc-value tnum">' + fmt(Math.round(price * 1e8) / 1e8) + ' LOOP</div></div>' +
          '<div class="calc-cell"><div class="cc-label">Marketplace fee ' + fmt(feePct) + '%</div><div class="cc-value tnum">' + fmt(Math.round(fee * 1e8) / 1e8) + ' LOOP</div></div>' +
          '<div class="calc-cell"><div class="cc-label">Royalty ' + royalty + '%</div><div class="cc-value tnum">' + fmt(Math.round(roy * 1e8) / 1e8) + ' LOOP</div></div>' +
          '<div class="calc-cell"><div class="cc-label">Seller receives</div><div class="cc-value tnum">' + fmt(Math.round(seller * 1e8) / 1e8) + ' LOOP</div></div>';
      }
      priceInput.addEventListener("input", runCalc);
      royaltyInput.addEventListener("input", runCalc);
      runCalc();
    }
  </script>

    <script>
    /* ================= NAV / ROUTER / CHROME ================= */
    var NAV_ITEMS = [
      { route: "explore", label: "Explore", icon: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/>' },
      { route: "collection", label: "Collection", icon: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/>' },
      { route: "activity", label: "Activity", icon: '<path d="M3 12h4l2.5-6 4 12L16 12h5"/>' },
      { route: "create", label: "Create", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>' }
    ];
    function navIcon(paths) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
    }
    function currentRoute() {
      var h = (location.hash || "#/explore").replace(/^#\/?/, "");
      var parts = h.split("/");
      return { name: parts[0] || "explore", arg: parts[1] || null };
    }
    function activeNav(routeName) {
      if (routeName === "explore") return "explore";
      if (routeName === "collection" || routeName === "collection-profile" || routeName === "token") return "collection";
      if (routeName === "activity") return "activity";
      if (routeName === "create") return "create";
      return "";
    }
    function renderNavs() {
      var active = activeNav(currentRoute().name);
      document.getElementById("bottom-nav").innerHTML = NAV_ITEMS.map(function (n) {
        return '<button class="bn-item' + (active === n.route ? " active" : "") + '" data-nav="' + n.route + '">' + navIcon(n.icon) + "<span>" + n.label + "</span></button>";
      }).join("");
      document.querySelectorAll("[data-nav]").forEach(function (b) {
        b.addEventListener("click", function () { location.hash = "#/" + b.getAttribute("data-nav"); });
      });
    }
    var DRAWER_ITEMS = [
      { label: "Discover", hash: "#/explore", icon: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/>' },
      { label: "Collections", hash: "#/collection", icon: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/>' },
      { label: "Activity", hash: "#/activity", icon: '<path d="M3 12h4l2.5-6 4 12L16 12h5"/>' },
      { label: "Create", hash: "#/create", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>' },
      { sep: true },
      { label: "Statistics", hash: "#/statistics", icon: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2" transform="scale(.92) translate(1 1)"/>' },
      { label: "Documents", hash: "#/documents", icon: '<path d="M6 2.5h8L19 7.5v14H6Z"/><path d="M13.5 2.5v5.5H19"/>' },
      { label: "Pricing & Fees", hash: "#/documents", icon: '<path d="M12.6 3.6 21 12l-9 9-8.4-8.4a2 2 0 0 1 0-2.8Z" transform="scale(.92) translate(1 1)"/><circle cx="8" cy="8" r="1.6"/>' },
      { label: "Safety Center", hash: "#/documents", icon: '<path d="M12 3 5 5.8v5.4c0 4.6 3 7.7 7 9.3 4-1.6 7-4.7 7-9.3V5.8Z"/><path d="m9 11.8 2.2 2.2 4-4.2"/>' },
      { sep: true },
      { label: "My NFTs / Profile", hash: "#/profile", icon: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>' }
    ];
    function renderDrawerNav() {
      document.getElementById("drawer-nav").innerHTML = DRAWER_ITEMS.map(function (item) {
        if (item.sep) return '<div class="drawer-sep"></div>';
        return '<button class="drawer-link" data-drawer-hash="' + item.hash + '"><span class="dic">' + navIcon(item.icon) + "</span>" + item.label + "</button>";
      }).join("");
      document.querySelectorAll("[data-drawer-hash]").forEach(function (b) {
        b.addEventListener("click", function () {
          closeDrawer();
          var target = b.getAttribute("data-drawer-hash");
          if (target === "#/profile" && W.address) target = "#/profile/" + W.address;
          location.hash = target;
        });
      });
    }
    function openDrawer() { document.getElementById("drawer-root").classList.add("open"); renderDrawerProfile(); }
    function closeDrawer() { document.getElementById("drawer-root").classList.remove("open"); }

    /* ---------------- search ---------------- */
    function openSearch() {
      document.getElementById("search-panel").classList.add("open");
      renderSearchResults("");
      setTimeout(function () { document.getElementById("search-input").focus(); }, 30);
    }
    function closeSearch() {
      document.getElementById("search-panel").classList.remove("open");
      document.getElementById("search-input").value = "";
    }
    function renderSearchResults(q) {
      var box = document.getElementById("search-results");
      q = (q || "").trim().toLowerCase();
      if (!S.loaded) { box.innerHTML = '<div class="search-empty">Reading the live collection…</div>'; return; }
      if (!S.online) { box.innerHTML = '<div class="search-empty">Live data is unavailable right now — search works again as soon as the Loop Network connection is back.</div>'; return; }
      if (!q) {
        var trending = [];
        var seen = {};
        S.salesAll.forEach(function (s) {
          if (trending.length >= 6) return;
          var t = S.tokenById.get(s.tokenId);
          if (t && !seen[t.tokenId]) { seen[t.tokenId] = true; trending.push(t); }
        });
        if (trending.length < 6) {
          S.tokens.forEach(function (t) { if (trending.length < 6 && !seen[t.tokenId]) { seen[t.tokenId] = true; trending.push(t); } });
        }
        box.innerHTML = '<div class="search-label">Trending on Loop Market</div>' + (trending.length ? trending.map(searchItemHtml).join("") : '<div class="search-empty">No tokens yet.</div>');
        bindSearchItems(box);
        return;
      }
      var isAddr = /^0x[0-9a-f]{4,}$/.test(q);
      var idMatch = q.replace(/^#/, "");
      var results = S.tokens.filter(function (t) {
        if ((t.name || "").toLowerCase().indexOf(q) >= 0) return true;
        if (String(t.tokenId) === idMatch) return true;
        if (t.owner.toLowerCase().indexOf(q) >= 0) return true;
        return t.traits.some(function (tr) { return (tr.label + " " + tr.value).toLowerCase().indexOf(q) >= 0; });
      }).slice(0, 12);
      var html = "";
      if (isAddr) {
        var owns = S.tokens.filter(function (t) { return t.owner.toLowerCase() === q; }).length;
        html += '<div class="search-label">Wallet</div><button class="search-item" data-search-profile="' + esc(q) + '">' + avatarImg(q, 40) +
          '<span><span class="si-name addr" style="display:block">' + shortAddr(q) + '</span><span class="si-sub" style="display:block">Profile · holds ' + owns + ' LMNFT</span></span></button>';
      }
      html += '<div class="search-label">NFTs</div>' + (results.length ? results.map(searchItemHtml).join("") : '<div class="search-empty">No NFTs match “' + esc(q) + '”.</div>');
      box.innerHTML = html;
      bindSearchItems(box);
    }
    function searchItemHtml(t) {
      var sub = (S.contracts ? S.contracts.nftName : "Loop Market NFT") + " · #" + t.tokenId + " · Owner " + shortAddr(t.owner) +
        (t.listing && t.listing.active ? " · " + fmt(t.listing.priceLoop) + " LOOP" : "");
      return '<button class="search-item" data-search-token="' + t.tokenId + '">' + tokenImgHtml(t) +
        '<span style="min-width:0"><span class="si-name" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(tokenTitle(t)) + '</span><span class="si-sub" style="display:block">' + esc(sub) + "</span></span></button>";
    }
    function bindSearchItems(box) {
      box.querySelectorAll("[data-search-token]").forEach(function (el) {
        // tokenImgHtml images inside search items need the small size.
        el.querySelectorAll("img").forEach(function (img) { img.style.width = "40px"; img.style.height = "40px"; img.style.borderRadius = "10px"; });
        el.querySelectorAll(".thumb-ph").forEach(function (ph) { ph.style.width = "40px"; ph.style.height = "40px"; ph.style.borderRadius = "10px"; ph.style.flex = "none"; });
        el.addEventListener("click", function () { closeSearch(); location.hash = "#/token/" + el.getAttribute("data-search-token"); });
      });
      box.querySelectorAll("[data-search-profile]").forEach(function (el) {
        el.addEventListener("click", function () { closeSearch(); location.hash = "#/profile/" + el.getAttribute("data-search-profile"); });
      });
    }

    /* ---------------- theme ---------------- */
    function applyThemeIcon() {
      var dark = document.documentElement.dataset.theme !== "light";
      document.getElementById("ic-moon").style.display = dark ? "" : "none";
      document.getElementById("ic-sun").style.display = dark ? "none" : "";
    }
    function toggleTheme() {
      var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("loop-market-theme", next); } catch (e) { /* private mode */ }
      applyThemeIcon();
    }

    /* ---------------- render root ---------------- */
    var lastHash = location.hash;
    function rerender() {
      var app = document.getElementById("app");
      var y = window.scrollY;
      route(app);
      if (location.hash === lastHash) window.scrollTo(0, y);
    }
    function route(app) {
      app = app || document.getElementById("app");
      var r = currentRoute();
      renderNavs();
      switch (r.name) {
        case "collection": renderCollection(app); break;
        case "collection-profile": renderCollectionProfile(app); break;
        case "activity": renderActivity(app); break;
        case "statistics": renderStatistics(app); break;
        case "documents": renderDocuments(app); break;
        case "create": renderCreate(app); break;
        case "token": renderToken(app, Number(r.arg)); break;
        case "profile":
          if (r.arg) renderProfile(app, r.arg);
          else if (W.address) { location.hash = "#/profile/" + W.address; }
          else {
            app.innerHTML = '<div class="page"><h1 class="page-title">My NFTs</h1><div class="empty-note" style="margin-top:14px">Connect your wallet to see your Loop Market NFTs, listings and offers — your profile is read live from the chain.</div><p style="margin-top:16px"><button class="btn btn-primary" id="profile-connect">Connect Wallet</button></p></div>';
            document.getElementById("profile-connect").addEventListener("click", connectWallet);
          }
          break;
        case "explore":
        default: renderExplore(app); break;
      }
    }

    /* ---------------- init ---------------- */
    function init() {
      renderNavs();
      renderDrawerNav();
      renderWalletSlot();
      applyThemeIcon();
      document.getElementById("btn-theme").addEventListener("click", toggleTheme);
      document.getElementById("btn-search").addEventListener("click", openSearch);
      document.getElementById("search-close").addEventListener("click", closeSearch);
      document.getElementById("search-backdrop").addEventListener("click", closeSearch);
      document.getElementById("search-input").addEventListener("input", function (e) { renderSearchResults(e.target.value); });
      document.getElementById("btn-drawer").addEventListener("click", openDrawer);
      document.getElementById("drawer-close").addEventListener("click", closeDrawer);
      document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeSearch(); closeDrawer(); }
      });
      window.addEventListener("hashchange", function () {
        var changed = location.hash !== lastHash;
        lastHash = location.hash;
        route();
        if (changed) window.scrollTo(0, 0);
      });
      route();
      initWalletListeners();
      loadMarketplace().then(function () { rerender(); });
      // Silent background refresh — no button, no reload, no scroll reset.
      setInterval(function () {
        if (document.hidden || W.busy) return;
        loadMarketplace().then(function () {
          if (currentRoute().name !== "create") rerender();
          if (document.getElementById("search-panel").classList.contains("open")) {
            renderSearchResults(document.getElementById("search-input").value);
          }
        });
      }, 30000);
      // Activity refreshes on a tighter loop (events only).
      setInterval(function () {
        if (document.hidden || W.busy || S.loading) return;
        var name = currentRoute().name;
        if (name !== "activity" && name !== "statistics") return;
        loadEvents().then(function (ev) {
          S.events = ev.events; S.salesAll = ev.salesAll;
          finishDerived(new Date().toISOString());
          rerender();
        }).catch(function () { /* keep the current view on a failed poll */ });
      }, 20000);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
    </script>
  </body>
